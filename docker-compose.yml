services:
  mysql:
    image: mysql:8.4
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: erp_dev
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 編號決定執行順序：init.sql 先建庫與帳號，框架的表才建得起來。
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/database/framework/scheduler.sql:/docker-entrypoint-initdb.d/02-scheduler.sql:ro
      - ./server/database/framework/jwt.sql:/docker-entrypoint-initdb.d/03-jwt.sql:ro
      - ./server/database/framework/idempotency.sql:/docker-entrypoint-initdb.d/04-idempotency.sql:ro

  adminer:
    image: adminer:4
    container_name: erp_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
